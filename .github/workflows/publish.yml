name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: npm install

            - run: npm run build

            # Auth: npm Trusted Publishing (OIDC). Remove repo NPM_TOKEN if present — setup-node
            # maps it to NODE_AUTH_TOKEN and stale tokens cause E404 on @1claw/* publishes.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            # Node 22 bundles npm 10.x, which cannot do Trusted Publishing: it
            # sends no credential, and npm reports the failed auth as a 404 on
            # the package. Every publish from this workflow has failed that way.
            # The range enforces the floor the feature actually requires rather
            # than trusting whatever @latest happens to be.
            - name: Upgrade npm to a Trusted-Publishing-capable version
              run: |
                  # Pinned exactly, not @latest or a range. This runs in a job holding
                  # id-token: write and an npm environment, immediately before
                  # publishing public packages -- so whatever this resolves to
                  # executes with the credential that publishes them. A floating
                  # version makes that an unreviewed third-party input on every run.
                  # Bump deliberately: raise the number here, in one commit, across
                  # every publish workflow.
                  npm install -g npm@11.5.1
                  npm --version

            # Strip any _authToken setup-node wrote, so OIDC is actually used.
            #
            # A repo-level NPM_TOKEN secret is mapped to NODE_AUTH_TOKEN by
            # setup-node, which writes it into the job's .npmrc. npm then uses
            # that token and never attempts the OIDC exchange -- so a stale or
            # rotated token silently shadows Trusted Publishing, and npm
            # reports the rejected credential as `E404 PUT .../@1claw%2fcli`,
            # which reads as "package not found" rather than "your auth was
            # refused". v0.61.34 failed exactly this way with NODE_AUTH_TOKEN
            # present in the environment.
            #
            # The comment above has asked for years that the secret be removed
            # by hand. This makes the workflow not care whether it was: the
            # line is deleted from the .npmrc at the point of use, so OIDC is
            # the only credential available and a leftover secret cannot
            # quietly take over again.
            - name: Use OIDC, not a leftover token
              run: |
                  NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
                  if [ -f "$NPMRC" ] && grep -q '_authToken' "$NPMRC"; then
                    echo "::warning::A repo NPM_TOKEN was present and is being ignored; Trusted Publishing (OIDC) will be used. Delete the secret to silence this."
                    grep -v '_authToken' "$NPMRC" > "$NPMRC.clean"
                    mv "$NPMRC.clean" "$NPMRC"
                  fi
                  echo "npmrc now:"; sed 's/=.*/=<redacted>/' "$NPMRC" 2>/dev/null || true

            - run: npm publish --provenance --access public
              env:
                  # Belt and braces: even if something re-adds it, an empty
                  # value cannot authenticate and npm falls through to OIDC.
                  NODE_AUTH_TOKEN: ""

            - name: Extract version
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

    update-homebrew:
        name: Update Homebrew Tap
        runs-on: ubuntu-latest
        needs: publish
        if: needs.publish.outputs.version != ''
        steps:
            - name: Trigger formula update
              run: |
                  curl -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
                    https://api.github.com/repos/1clawAI/homebrew-tap/dispatches \
                    -d '{
                      "event_type": "update-formula",
                      "client_payload": {
                        "package": "cli",
                        "version": "${{ needs.publish.outputs.version }}"
                      }
                    }'
