name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: npm install

            - run: npm run build

            # Auth: npm Trusted Publishing (OIDC). Remove repo NPM_TOKEN if present — setup-node
            # maps it to NODE_AUTH_TOKEN and stale tokens cause E404 on @1claw/* publishes.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - run: npm publish --provenance --access public

            - name: Extract version
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

    update-homebrew:
        name: Update Homebrew Tap
        runs-on: ubuntu-latest
        needs: publish
        if: needs.publish.outputs.version != ''
        steps:
            - name: Trigger formula update
              run: |
                  curl -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
                    https://api.github.com/repos/1clawAI/homebrew-tap/dispatches \
                    -d '{
                      "event_type": "update-formula",
                      "client_payload": {
                        "package": "cli",
                        "version": "${{ needs.publish.outputs.version }}"
                      }
                    }'
