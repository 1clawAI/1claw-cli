name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: npm install

            - run: npm run build

            # Auth: npm Trusted Publishing (OIDC). Remove repo NPM_TOKEN if present — setup-node
            # maps it to NODE_AUTH_TOKEN and stale tokens cause E404 on @1claw/* publishes.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            # Node 22 bundles npm 10.x, which cannot do Trusted Publishing: it
            # sends no credential, and npm reports the failed auth as a 404 on
            # the package. Every publish from this workflow has failed that way.
            # The range enforces the floor the feature actually requires rather
            # than trusting whatever @latest happens to be.
            - name: Upgrade npm to a Trusted-Publishing-capable version
              run: |
                  # Pinned exactly, not @latest or a range. This runs in a job holding
                  # id-token: write and an npm environment, immediately before
                  # publishing public packages -- so whatever this resolves to
                  # executes with the credential that publishes them. A floating
                  # version makes that an unreviewed third-party input on every run.
                  # Bump deliberately: raise the number here, in one commit, across
                  # every publish workflow.
                  npm install -g npm@11.5.1
                  npm --version

            # Publish, and say what a failure actually means.
            #
            # npm reports a rejected publish credential as
            # `E404 PUT .../@1claw%2fcli` -- "the package does not exist" when
            # it means "your auth was refused". That single fact has cost this
            # project several debugging sessions, and no amount of reading the
            # log helps if you do not already know it.
            #
            # Two credentials can be in play and they fail differently:
            #   * a repo NPM_TOKEN, which setup-node writes into .npmrc as
            #     _authToken. Stale or rotated -> E404.
            #   * Trusted Publishing (OIDC), used when no token is present and
            #     a publisher is registered for the package on npmjs.com. Not
            #     registered -> ENEEDAUTH, because npm has nothing to send.
            #
            # v0.61.34 produced E404 with a token present, then ENEEDAUTH with
            # the token removed: the token is dead AND no Trusted Publisher is
            # registered. Both need fixing, and neither is visible from the
            # raw npm output.
            #
            # The token is deliberately left in place rather than stripped: a
            # refreshed one must keep working. This step only explains.
            - name: Publish
              id: publish
              continue-on-error: true
              run: npm publish --provenance --access public

            - name: Explain a publish failure
              if: steps.publish.outcome == 'failure'
              run: |
                  echo "::error::npm publish failed. The two likely causes both report misleadingly:"
                  echo "::error::  E404 on PUT  -> the NPM_TOKEN secret is stale or revoked (npm reports refused auth as 404, not 403)."
                  echo "::error::  ENEEDAUTH    -> no credential at all: no NPM_TOKEN, and no Trusted Publisher registered for this package on npmjs.com."
                  echo "::error::Fix: register a Trusted Publisher (Settings -> Trusted Publisher -> GitHub Actions) and delete the NPM_TOKEN secret, or refresh the token."
                  exit 1

            - name: Extract version
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

    update-homebrew:
        name: Update Homebrew Tap
        runs-on: ubuntu-latest
        needs: publish
        if: needs.publish.outputs.version != ''
        steps:
            - name: Trigger formula update
              run: |
                  curl -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
                    https://api.github.com/repos/1clawAI/homebrew-tap/dispatches \
                    -d '{
                      "event_type": "update-formula",
                      "client_payload": {
                        "package": "cli",
                        "version": "${{ needs.publish.outputs.version }}"
                      }
                    }'
