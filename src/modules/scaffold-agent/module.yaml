name: scaffold-agent
version: 1.0.0
description: >
  Scaffold-ETH 2 integration for full-stack dApp agents. Adds tooling to
  interact with SE-2 contracts using 1Claw-managed signing keys.
author: 1Claw
homepage: https://1claw.xyz

docker:
  packages:
    - "@1claw/sdk@latest"
    - "viem@latest"
  apk:
    - git
  copy:
    - src: startup.sh
      dest: /app/modules/scaffold-agent/startup.sh
  env:
    SCAFFOLD_AGENT_ENABLED: "true"
  ports: []

required_secrets: []

tools:
  - submit_transaction
  - sign_transaction

conflicts: []
depends:
  - onchain
